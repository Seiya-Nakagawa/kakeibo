[project]
name = "webapp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=5.2.8,<5.3",
    "django-allauth[socialaccount]>=65.12.1",
    "django-environ>=0.14.0",
    "google-api-python-client>=2.184.0",
    "google-auth>=2.41.1",
    "google-auth-httplib2>=0.2.0",
    "gunicorn>=26.0.0",
    "mysqlclient>=2.2.8",
]

[tool.ruff]
# migrationsはDjangoが自動生成するコードであり、手動整形・lintの対象にしない。
extend-exclude = ["*/migrations/*.py"]

[tool.ruff.lint.per-file-ignores]
# Django の Meta.constraints/indexes はモデル定義時にのみ参照される規約上の書き方であり、
# 可変なクラス属性デフォルト値(RUF012)の懸念（インスタンス間の値共有）が当てはまらない。
"**/models.py" = ["RUF012"]
# Django の ModelForm.Meta.widgets も同様に、フォーム定義時にのみ参照される規約上の書き方。
"**/forms.py" = ["RUF012"]
