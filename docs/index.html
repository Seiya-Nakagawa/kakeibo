<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>家計簿</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #ffffff;
      color: #1e293b;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 20px; /* 全体の基準をさらにアップ */
    }
    .container {
      width: 100%;
      padding: 0 16px 40px;
      box-sizing: border-box;
    }
    .app-header {
      padding: 30px 0 10px;
      text-align: center;
    }
    .app-header h1 { font-size: 2.2rem; margin: 0; }
    
    .form-container {
      width: 100%;
    }
    
    label {
      display: block;
      font-size: 2.2rem; /* さらに大きく */
      font-weight: 900;
      margin: 40px 0 15px;
      color: #334155;
    }
    input, select {
      width: 100%;
      height: 120px; /* 極限の高さ */
      padding: 0 30px;
      border: 4px solid #e2e8f0;
      border-radius: 24px;
      font-size: 42px; /* 入力文字を極限まで巨大に */
      font-weight: bold;
      box-sizing: border-box;
      background: #fff;
      -webkit-appearance: none;
    }
    input:focus, select:focus { border-color: #2563eb; outline: none; }
    
    .btn {
      width: 100%;
      height: 90px; /* 特大ボタン */
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 20px;
      font-size: 1.8rem;
      font-weight: 900;
      margin-top: 50px;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(37,99,235,0.3);
    }
    .btn:disabled { background: #94a3b8; box-shadow: none; cursor: not-allowed; }
    .btn:active:not(:disabled) { transform: scale(0.96); opacity: 0.9; }
    
    #message { margin-top: 30px; padding: 20px; border-radius: 12px; display: none; text-align: center; font-weight: 800; font-size: 1.2rem; }

    /* 電卓スタイル */
    /* 電卓起動ボタン（入力欄と同サイズ） */
    .calc-btn-trigger {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 120px;
      background: #f1f5f9;
      border: 4px solid #cbd5e1;
      border-radius: 24px;
      font-size: 42px; /* 入力欄(42px)と合わせる */
      font-weight: bold;
      cursor: pointer;
      color: #334155;
    }
    .calc-btn-trigger:active { background: #e2e8f0; }
    .calc-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .calculator {
      background: #fff;
      width: 100%;
      height: 100%;
      max-width: none;
      border-radius: 0;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }
    .calc-display {
      width: 100%;
      height: 140px; /* さらに高く */
      background: #f8fafc;
      border-radius: 18px;
      margin-bottom: 30px;
      text-align: right;
      padding: 20px;
      font-size: 6rem; /* さらに巨大化 */
      font-weight: bold;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      overflow-x: auto; /* 長い計算式でも対応 */
    }
    .calc-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }
    .calc-key {
      height: 100%;
      min-height: 70px;
      border: none;
      border-radius: 20px;
      font-size: 3.5rem; /* さらに大きく */
      font-weight: bold;
      background: #f1f5f9;
      color: #334155;
      cursor: pointer;
    }
    .calc-key.op { background: #e2e8f0; color: #1e293b; font-size: 4rem; }
    .calc-key.action { background: #2563eb; color: #fff; grid-column: span 2; font-size: 2.8rem; }
    .calc-key.clear { background: #fef2f2; color: #991b1b; }
    .calc-key:active { background: #cbd5e1; }
    
    /* 日付入力欄内の曜日表示用 */
    .date-wrapper {
      position: relative;
      width: 100%;
    }
    #dayOfWeek {
      position: absolute;
      right: 50px; /* カレンダーアイコンを避ける */
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none; /* 下の入力を邪魔しない */
      font-weight: bold;
      font-size: 1.4rem;
    }
    input[type="date"] {
      padding-right: 100px; /* 曜日分の余白 */
    }
  </style>
</head>
<body>
  <div class="calc-overlay" id="calcOverlay">
    <div class="calculator">
      <div class="calc-display" id="calcDisplay">0</div>
      <div class="calc-grid">
        <button type="button" class="calc-key clear" onclick="calcAction('C')">C</button>
        <button type="button" class="calc-key op" onclick="calcAction('/')">÷</button>
        <button type="button" class="calc-key op" onclick="calcAction('*')">×</button>
        <button type="button" class="calc-key op" onclick="calcAction('back')">⌫</button>
        
        <button type="button" class="calc-key" onclick="calcAction('7')">7</button>
        <button type="button" class="calc-key" onclick="calcAction('8')">8</button>
        <button type="button" class="calc-key" onclick="calcAction('9')">9</button>
        <button type="button" class="calc-key op" onclick="calcAction('-')">-</button>
        
        <button type="button" class="calc-key" onclick="calcAction('4')">4</button>
        <button type="button" class="calc-key" onclick="calcAction('5')">5</button>
        <button type="button" class="calc-key" onclick="calcAction('6')">6</button>
        <button type="button" class="calc-key op" onclick="calcAction('+')">+</button>
        
        <button type="button" class="calc-key" onclick="calcAction('1')">1</button>
        <button type="button" class="calc-key" onclick="calcAction('2')">2</button>
        <button type="button" class="calc-key" onclick="calcAction('3')">3</button>
        <button type="button" class="calc-key op" onclick="calcAction('=')">=</button>
        
        <button type="button" class="calc-key" onclick="calcAction('0')">0</button>
        <button type="button" class="calc-key" onclick="calcAction('.')">.</button>
        <button type="button" class="calc-key action" onclick="calcApply()">反映する</button>
        <button type="button" class="calc-key" style="grid-column: span 2; background: #94a3b8; color: #fff;" onclick="toggleCalc(false)">閉じる</button>
      </div>
    </div>
  </div>
  <div class="container">
    <div class="app-header">
      <h1>💰 家計簿入力</h1>
    </div>
    
    <div class="form-container">
      <form id="entryForm">
        <label>📅 日付</label>
        <div class="date-wrapper">
          <input type="date" name="date" required>
          <span id="dayOfWeek"></span>
        </div>
        
        <label>💴 金額</label>
        <div style="display: flex; gap: 15px;">
          <input type="number" name="amount" placeholder="0" inputmode="numeric" required style="flex: 1.5;">
          <div class="calc-btn-trigger" onclick="toggleCalc(true)" style="flex: 1;">🧮 電卓</div>
        </div>
        
        <label>🛒 店舗・内容</label>
        <input type="text" name="shop" placeholder="どこで？" required>
        
        <label>🏷️ カテゴリ</label>
        <select name="category" required>
          <option value="">読み込み中...</option>
        </select>
        
        <label>📝 備考</label>
        <input type="text" name="memo" placeholder="メモ（任意）">

        <label>💳 支払方法</label>
        <select name="source" required>
          <option value="現金">現金</option>
          <option value="楽天ペイ">楽天ペイ</option>
          <option value="楽天カード">楽天カード</option>
          <option value="口座引落">口座引落</option>
        </select>
        
        <button type="submit" class="btn" id="submitBtn" disabled>読み込み中...</button>
        <div id="message"></div>
      </form>
    </div>
  </div>

  <script>
    // GASのWeb App APIのURL
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwJkGi-ZjBbujrOGC5lajEsW_bEzO8vfhhqtZwaA_ltEMRkQcz_X6Qx46fzimgel_sfVg/exec";

    function showMessage(text, color) {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.style.display = 'block';
      msg.style.background = color === 'green' ? '#ecfdf5' : '#fef2f2';
      msg.style.color = color === 'green' ? '#065f46' : '#991b1b';
      setTimeout(() => { msg.style.display = 'none'; }, 5000);
    }

    const dayOfWeekSpan = document.getElementById('dayOfWeek');
    const dateInput = document.querySelector('[name=date]');
    const weekDays = ['日', '月', '火', '水', '木', '金', '土'];

    function updateDayOfWeek() {
      const dateVal = dateInput.value;
      if (dateVal) {
        const date = new Date(dateVal);
        const dayIdx = date.getDay();
        const day = weekDays[dayIdx];
        dayOfWeekSpan.textContent = '(' + day + ')';
        
        // 色付け
        if (dayIdx === 0) dayOfWeekSpan.style.color = '#ef4444'; // 日: 赤
        else if (dayIdx === 6) dayOfWeekSpan.style.color = '#3b82f6'; // 土: 青
        else dayOfWeekSpan.style.color = '#64748b'; // 平日: グレー
      } else {
        dayOfWeekSpan.textContent = '';
      }
    }

    function getTodayString() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // 初期化処理: カテゴリ一覧の取得と日付の初期設定
    function initApp() {
      const btn = document.getElementById('submitBtn');
      fetch(GAS_API_URL + "?action=init")
        .then(res => {
          if (!res.ok) throw new Error('Network response was not ok');
          return res.json();
        })
        .then(data => {
          // カテゴリの描画
          const categorySelect = document.querySelector('[name=category]');
          if (data.categories && data.categories.length > 0) {
            categorySelect.innerHTML = data.categories
              .map(c => '<option value="' + escapeHtml(c) + '">' + escapeHtml(c) + '</option>')
              .join('\n');
          } else {
            categorySelect.innerHTML = '<option value="">カテゴリが取得できませんでした</option>';
          }

          // 今日の日付を設定
          dateInput.value = getTodayString();
          updateDayOfWeek();
          
          btn.disabled = false;
          btn.textContent = '登録する';
        })
        .catch(err => {
          showMessage('初期データの取得に失敗しました', 'red');
          console.error(err);
        });
    }

    // 電卓ロジック
    let calcExpr = '';
    let errorTimeoutId = null;
    const calcDisplay = document.getElementById('calcDisplay');
    const amountInput = document.querySelector('[name=amount]');

    function toggleCalc(show) {
      document.getElementById('calcOverlay').style.display = show ? 'flex' : 'none';
      if (show) {
        if (errorTimeoutId) {
          clearTimeout(errorTimeoutId);
          errorTimeoutId = null;
        }
        calcExpr = amountInput.value || '0';
        updateCalcDisplay();
      }
    }

    function updateCalcDisplay() {
      calcDisplay.textContent = calcExpr || '0';
    }

    function calcAction(val) {
      if (errorTimeoutId) {
        clearTimeout(errorTimeoutId);
        errorTimeoutId = null;
        if (calcExpr === 'Error') {
          calcExpr = '';
        }
      }

      if (val === 'C') {
        calcExpr = '';
      } else if (val === 'back') {
        calcExpr = calcExpr.slice(0, -1);
      } else if (val === '=') {
        try {
          calcExpr = String(Function('"use strict";return (' + calcExpr.replace(/[^-()\\d/*+.]/g, '') + ')')());
        } catch (e) {
          calcExpr = 'Error';
          updateCalcDisplay();
          errorTimeoutId = setTimeout(() => {
            calcExpr = '';
            updateCalcDisplay();
            errorTimeoutId = null;
          }, 1000);
          return;
        }
      } else {
        if (calcExpr === '0' && !isNaN(val)) calcExpr = val;
        else calcExpr += val;
      }
      updateCalcDisplay();
    }

    function calcApply() {
      calcAction('=');
      if (calcExpr !== 'Error') {
        amountInput.value = calcExpr;
        toggleCalc(false);
      }
    }

    dateInput.addEventListener('change', updateDayOfWeek);

    document.getElementById('entryForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = '登録中...';

      const data = {
        date: e.target.date.value,
        amount: e.target.amount.value,
        shop: e.target.shop.value,
        category: e.target.category.value,
        source: e.target.source.value,
        memo: e.target.memo.value
      };

      // CORSプリフライトを避けるため Content-Type: text/plain でJSONを送信
      fetch(GAS_API_URL, {
        method: 'POST',
        mode: 'cors',
        headers: {
          'Content-Type': 'text/plain'
        },
        body: JSON.stringify(data)
      })
      .then(res => {
        if (!res.ok) throw new Error('API response was not ok');
        return res.json();
      })
      .then(res => {
        if (res.success) {
          showMessage('登録しました ✅', 'green');
          e.target.reset();
          dateInput.value = getTodayString();
          updateDayOfWeek();
        } else {
          showMessage('エラー: ' + res.error, 'red');
        }
        btn.disabled = false;
        btn.textContent = '登録する';
      })
      .catch(err => {
        showMessage('通信エラーが発生しました', 'red');
        console.error(err);
        btn.disabled = false;
        btn.textContent = '登録する';
      });
    });

    // 起動時にロード処理を実行
    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
