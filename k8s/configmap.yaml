# 機密情報を含まない設定値のみを保持する。機密情報はscripts/create_secret.shで
# 作成するkakeibo-secretsで供給する（基本設計書7.3節）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: kakeibo-config
  namespace: kakeibo
data:
  ALLOWED_HOSTS: "technohonesty.com"
  FORCE_SCRIPT_NAME: "/kakeibo"
  DB_SOCKET_PATH: "/var/run/mysqld/mysqld.sock"
  # 要件4.9.6: 無操作30分でセッション失効（既定値のため通常は変更不要）。
  SESSION_TIMEOUT_SECONDS: "1800"
